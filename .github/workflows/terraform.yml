name: Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest -r dashboard/requirements.txt

      - name: Run tests
        run: pytest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Check Terraform formatting
        run: terraform fmt -check -diff

  terraform:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::790873128115:role/golf-stats-github-actions-deploy-role
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install smoke test dependencies
        run: pip install pytest

      - name: Smoke test API
        run: |
          API_KEY=$(aws apigateway get-api-keys --include-values \
            --query "items[?name=='golf-stats-dashboard'].value" --output text)
          echo "::add-mask::$API_KEY"
          API_URL=$(terraform output -raw api_url) HANDICAP_URL=$(terraform output -raw handicap_url) API_KEY="$API_KEY" pytest smoke -v
